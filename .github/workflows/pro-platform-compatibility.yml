name: Pro Platform Compatibility Matrix

on:
  pull_request:
    paths:
      - 'frameworks/**'
      - 'tests/Integration/**'
      - 'composer.json'
      - '.github/workflows/pro-platform-compatibility.yml'
  push:
    branches:
      - main
      - 'implementation/**'
    paths:
      - 'frameworks/**'
      - 'tests/Integration/**'
      - 'composer.json'
      - '.github/workflows/pro-platform-compatibility.yml'
  workflow_dispatch:
  # Full matrix weekly; pull requests run only the minimum and reference cells.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: wpessential-platform-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-php-matrix:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"wordpress":"6.9","php":"8.2"},{"wordpress":"7.1","php":"8.5"}]' || '[{"wordpress":"6.9","php":"8.2"},{"wordpress":"6.9","php":"8.3"},{"wordpress":"6.9","php":"8.4"},{"wordpress":"6.9","php":"8.5"},{"wordpress":"7.1","php":"8.2"},{"wordpress":"7.1","php":"8.3"},{"wordpress":"7.1","php":"8.4"},{"wordpress":"7.1","php":"8.5"}]') }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Check out WPEssential Free
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Vertex-Systems-Network/wpessential
          ref: ${{ vars.WPE_FREE_REF || 'main' }}
          path: .wpessential-free
          token: ${{ secrets.WPE_FREE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Place the Free checkout beside Pro
        shell: bash
        run: |
          set -euo pipefail
          free_root="$(dirname "${GITHUB_WORKSPACE}")/wpessential"
          rm -rf "${free_root}"
          mv "${GITHUB_WORKSPACE}/.wpessential-free" "${free_root}"
          test -f "${free_root}/wpessential.php"
          echo "WPE_FREE_ROOT=${free_root}" >> "${GITHUB_ENV}"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mysqli
          coverage: none

      - name: Prepare exact WordPress fixture
        shell: bash
        env:
          WPE_MATRIX_WORDPRESS: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress /tmp/wordpress.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://wordpress.org/wordpress-${WPE_MATRIX_WORDPRESS}.tar.gz" \
            --output /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-load.php

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          find frameworks tests/Integration -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l wpessential-pro.php

      - name: MySQL Definition Audit persistence integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/platform-persistence-mysql.php

      - name: Real WordPress Roles read-seam integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-roles-read-seam.php

      - name: Real WordPress Fields registered-meta integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-fields-meta-registration.php

      - name: Real WordPress Fields post-meta persistence integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-fields-meta-persistence.php

      - name: Real WordPress Fields storage-key migration integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-fields-storage-key-migration.php

      - name: Real WordPress Fields value Ability integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: |
          php tests/Integration/wordpress-fields-value-ability.php
          php tests/Integration/wordpress-fields-value-ability-core.php

      - name: Real WordPress Fields composed runtime reference integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: php tests/Integration/wordpress-fields-runtime-reference.php

      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Check out WPEssential Free
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Vertex-Systems-Network/wpessential
          ref: ${{ vars.WPE_FREE_REF || 'main' }}
          path: .wpessential-free
          token: ${{ secrets.WPE_FREE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Place the Free checkout beside Pro
        shell: bash
        run: |
          set -euo pipefail
          free_root="$(dirname "${GITHUB_WORKSPACE}")/wpessential"
          rm -rf "${free_root}"
          mv "${GITHUB_WORKSPACE}/.wpessential-free" "${free_root}"
          test -f "${free_root}/wpessential.php"
          echo "WPE_FREE_ROOT=${free_root}" >> "${GITHUB_ENV}"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mysqli
          coverage: none

      - name: Prepare exact WordPress fixture
        shell: bash
        env:
          WPE_MATRIX_WORDPRESS: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress /tmp/wordpress.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://wordpress.org/wordpress-${WPE_MATRIX_WORDPRESS}.tar.gz" \
            --output /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-load.php

      - name: MariaDB persistence integration
        env:
          WPE_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=wpessential_test;charset=utf8mb4
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: |
          php tests/Integration/platform-persistence-mysql.php

      - name: MariaDB WordPress integration
        env:
          WPE_TEST_WORDPRESS_DIR: /tmp/wordpress
          WPE_TEST_WP_DB: wpessential_test
          WPE_TEST_WP_DB_HOST: 127.0.0.1:3306
          WPE_TEST_MYSQL_USER: root
          WPE_TEST_MYSQL_PASSWORD: root
        run: |
          php tests/Integration/wordpress-roles-read-seam.php
          php tests/Integration/wordpress-fields-meta-registration.php
          php tests/Integration/wordpress-fields-meta-persistence.php
          php tests/Integration/wordpress-fields-storage-key-migration.php
          php tests/Integration/wordpress-fields-value-ability.php
          php tests/Integration/wordpress-fields-value-ability-core.php
          php tests/Integration/wordpress-fields-runtime-reference.php
