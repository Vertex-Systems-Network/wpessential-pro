name: Taxonomy Role Impact

on:
  pull_request:
    paths:
      - 'frameworks/Modules/Roles/**'
      - 'wpessential-pro.php'
      - 'tests/Unit/Modules/Taxonomies/TaxonomyRoleImpactReadModelTest.php'
      - 'tests/Integration/wordpress-taxonomy-role-impact.php'
      - '.github/workflows/taxonomy-role-impact.yml'
  push:
    branches:
      - 'implementation/**'
    paths:
      - 'frameworks/Modules/Roles/**'
      - 'wpessential-pro.php'
      - 'tests/Unit/Modules/Taxonomies/TaxonomyRoleImpactReadModelTest.php'
      - 'tests/Integration/wordpress-taxonomy-role-impact.php'
      - '.github/workflows/taxonomy-role-impact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpessential-taxonomy-role-impact-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taxonomy-role-impact:
    name: WP ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', '7.1']
        php: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wpessential_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source head
        shell: bash
        env:
          WPE_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WPE_EXPECTED_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Check out WPEssential Free
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Vertex-Systems-Network/wpessential
          ref: ${{ vars.WPE_FREE_REF || 'main' }}
          path: .wpessential-free
          token: ${{ secrets.WPE_FREE_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Place the Free checkout beside Pro
        shell: bash
        run: |
          set -euo pipefail
          free_root="$(dirname "${GITHUB_WORKSPACE}")/wpessential"
          rm -rf "${free_root}"
          mv "${GITHUB_WORKSPACE}/.wpessential-free" "${free_root}"
          test -f "${free_root}/wpessential.php"
          echo "WPE_FREE_ROOT=${free_root}" >> "${GITHUB_ENV}"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mysqli
          coverage: none

      - name: Install locked PHP toolchain
        uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520
        with:
          dependency-versions: highest

      - name: Validate focused source and unit evidence
        shell: bash
        run: |
          set -euo pipefail
          php -l "${WPE_FREE_ROOT}/frameworks/Contracts/RoleImpactReadServiceInterface.php"
          php -l frameworks/Modules/Roles/RolesReadService.php
          php -l frameworks/Modules/Roles/RolesModule.php
          php -l "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies/TaxonomyRoleImpactReadModel.php"
          php -l "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies/TaxonomyDefinitionReadModel.php"
          php -l "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies/TaxonomyValidationAbilityHandler.php"
          php -l "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies/TaxonomyAbilityHandler.php"
          php -l "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies/TaxonomyModule.php"
          php -l "${WPE_FREE_ROOT}/wpessential.php"
          php -l wpessential-pro.php
          php -l tests/Integration/wordpress-taxonomy-role-impact.php
          vendor/bin/phpunit tests/Unit/Modules/Taxonomies/TaxonomyRoleImpactReadModelTest.php

      - name: Prepare exact WordPress fixture
        shell: bash
        env:
          WPE_MATRIX_WORDPRESS: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress /tmp/wordpress.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://wordpress.org/wordpress-${WPE_MATRIX_WORDPRESS}.tar.gz" \
            --output /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          test -f /tmp/wordpress/wp-load.php

      - name: Install pinned WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar \
            --output /tmp/wp-cli.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum -c -
          php /tmp/wp-cli.phar --allow-root cli version

      - name: Install real single-site WordPress
        shell: bash
        run: |
          set -euo pipefail
          wp='php /tmp/wp-cli.phar --allow-root --path=/tmp/wordpress'
          ${wp} config create \
            --dbname=wpessential_test \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check \
            --skip-salts \
            --force
          ${wp} core install \
            --url=http://wpessential.test \
            --title='WPEssential Taxonomy Role Impact' \
            --admin_user=wpessential_tax_role_admin \
            --admin_password='test-password-strong' \
            --admin_email='tax-role-admin@example.test' \
            --skip-email
          ${wp} core version

      - name: Install separated Free and Pro source fixtures
        shell: bash
        run: |
          set -euo pipefail
          plugin_root=/tmp/wordpress/wp-content/plugins
          free_root="${plugin_root}/wpessential"
          pro_root="${plugin_root}/wpessential-pro"
          rm -rf "${free_root}" "${pro_root}"
          mkdir -p \
            "${free_root}/frameworks/Modules" \
            "${pro_root}/frameworks/Modules"

          for shared in Bootstrap Contracts Kernel Platform; do
            cp -a "${WPE_FREE_ROOT}/frameworks/${shared}" "${free_root}/frameworks/${shared}"
          done
          cp -a "${WPE_FREE_ROOT}/frameworks/functions.php" "${free_root}/frameworks/functions.php"
          cp -a "${WPE_FREE_ROOT}/frameworks/Modules/CustomPostTypes" "${free_root}/frameworks/Modules/CustomPostTypes"
          cp -a "${WPE_FREE_ROOT}/frameworks/Modules/Taxonomies" "${free_root}/frameworks/Modules/Taxonomies"
          cp -a "${WPE_FREE_ROOT}/frameworks/Modules/SiteKit" "${free_root}/frameworks/Modules/SiteKit"
          composer install --working-dir="${WPE_FREE_ROOT}" --no-dev --no-interaction --prefer-dist --no-progress
          cp -a "${WPE_FREE_ROOT}/vendor" "${free_root}/vendor"
          cp -a "${WPE_FREE_ROOT}/wpessential.php" "${free_root}/wpessential.php"
          cp -a "${WPE_FREE_ROOT}/readme.txt" "${free_root}/readme.txt"
          cp -a "${GITHUB_WORKSPACE}/LICENSE" "${free_root}/LICENSE"

          for module_dir in "${GITHUB_WORKSPACE}"/frameworks/Modules/*; do
            module_name="$(basename "${module_dir}")"
            case "${module_name}" in
              CustomPostTypes|Taxonomies|SiteKit) continue ;;
            esac
            cp -a "${module_dir}" "${pro_root}/frameworks/Modules/${module_name}"
          done
          cp -a "${GITHUB_WORKSPACE}/wpessential-pro.php" "${pro_root}/wpessential-pro.php"
          cp -a "${GITHUB_WORKSPACE}/LICENSE" "${pro_root}/LICENSE"

          test -f "${free_root}/vendor/autoload.php"
          test -f "${free_root}/frameworks/Contracts/RoleImpactReadServiceInterface.php"
          test ! -e "${free_root}/frameworks/Modules/Roles"
          test -f "${pro_root}/frameworks/Modules/Roles/RolesModule.php"
          test ! -e "${pro_root}/frameworks/Kernel"

          wp='php /tmp/wp-cli.phar --allow-root --path=/tmp/wordpress'
          ${wp} plugin activate wpessential
          ${wp} plugin activate wpessential-pro
          ${wp} plugin status wpessential
          ${wp} plugin status wpessential-pro

      - name: Run canonical Surface 30-backed Taxonomy role-impact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/taxonomy-role-impact
          wp='php /tmp/wp-cli.phar --allow-root --path=/tmp/wordpress'
          script="${GITHUB_WORKSPACE}/tests/Integration/wordpress-taxonomy-role-impact.php"
          WPE_TAXONOMY_ROLE_IMPACT_EVIDENCE_PATH="${GITHUB_WORKSPACE}/artifacts/taxonomy-role-impact/evidence.json" \
            ${wp} eval "require '${script}';" | tee artifacts/taxonomy-role-impact/run.log
          test -s artifacts/taxonomy-role-impact/evidence.json
          jq -e '.schema == "wpessential-taxonomy-role-impact-evidence-v1" and .result == "PASS" and .canonical_surface30_service_consumed == true and .validation_role_impact_state == "healthy" and .definition_role_impact_state == "healthy" and .explicit_allow_preserved == true and .explicit_deny_preserved == true and .absent_preserved == true and .meta_context_reported == true and .diagnostic_not_final_authorization == true and .role_registry_unchanged == true' artifacts/taxonomy-role-impact/evidence.json >/dev/null
          cat artifacts/taxonomy-role-impact/evidence.json

      - name: Upload Taxonomy role-impact evidence
        if: always() && hashFiles('artifacts/taxonomy-role-impact/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taxonomy-role-impact-${{ matrix.wordpress }}-php-${{ matrix.php }}-${{ github.run_id }}
          path: artifacts/taxonomy-role-impact/
          if-no-files-found: error
          retention-days: 14

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"
